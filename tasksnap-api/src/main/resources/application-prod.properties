# Perfil de PRODUCCION - PostgreSQL en Render
# Render inyecta DATABASE_URL (jdbc:postgresql://usuario:pass@host:puerto/db)
spring.datasource.url=${DATABASE_URL}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false

# Render asigna el puerto dinamicamente via la variable PORT.
# Si no esta presente, usa 8080 por defecto (ej. pruebas locales con este perfil).
server.port=${PORT:8080}