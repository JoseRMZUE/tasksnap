# ==============================================================================
# CONFIGURACION DE BASE DE DATOS - H2 EN MEMORIA (Desarrollo Local)
# Traza: Objetivo Especifico 3 (Acta v5) -> Persistencia de datos centralizada.
# Estrategia: Usamos H2 hoy para iterar rapido sin instalar/configurar PostgreSQL.
#             En la Fase 5.5 (deploy) cambiaremos estas lineas al perfil 'postgres'.
# Esto mitiga el Riesgo 2 del Acta (servidores gratuitos dormidos): desarrollamos
# contra un motor local estable y solo probamos contra la nube al final.
# ==============================================================================

# 1. URL de Conexion H2
# jdbc:h2:mem:tareasnap -> Crea una BD llamada "tareasnap" en RAM.
# DB_CLOSE_DELAY=-1     -> Evita que H2 borre la BD cuando se cierra la ultima conexion.
#                         Sin esto, los datos desaparecen entre peticiones HTTP.
spring.datasource.url=jdbc:h2:mem:tareasnap;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

# 2. Credenciales H2 (valores por defecto del driver embebido)
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# 3. Consola H2 Habilitada (herramienta de inspeccion visual)
# Nos permitira VER los registros en el navegador mientras probamos:
# http://localhost:8080/h2-console  (JDBC URL = jdbc:h2:mem:tareasnap, user = sa)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==============================================================================
# CONFIGURACION DE JPA / HIBERNATE (El "Room" del backend)
# Traza: Patron Repositorio -> Mapeo Objeto-Relacional automatico, igual que
#        @Entity/@Dao en Android pero del lado del servidor.
# ==============================================================================

# ddl-auto=update -> Si cambio mi clase Java (@Entity), Hibernate actualiza la tabla SQL sola.
#                    Perfecto para desarrollo: no escribo CREATE TABLE a mano.
#                    (Nunca usar 'create-drop' en produccion porque borra datos reales).
spring.jpa.hibernate.ddl-auto=update

# show-sql=true -> Imprime en consola las sentencias SQL REALES que genera Hibernate.
#                  Vital para depurar: veras si tus entidades mapean bien las columnas.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


# ==============================================================================
# SERVIDOR WEB
# Traza: RF-19/RF-18/RF-20 -> Los endpoints REST escucharan aqui.
# ==============================================================================
server.port=8080